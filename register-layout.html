<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Layout</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./src/reset.css">
    <link rel="stylesheet" href="./src/style.css">
</head>


<body>
    <div class="register-container">
        <div class="register-wrapped">
            <div class="register-form">
                <div class="register-top">
                    <h1>REGISTER</h1>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nemo quidem totam accusamus iste facilis
                        aliquid.</p>
                </div>
                <form class="register-middle">
                    <div class="register-label">
                        <label for="email">Email</label>
                        <input type="text" placeholder="Email" id="email">
                    </div>
                    <div class="register-label">
                        <label for="password">Your Password</label>
                        <input type="password" placeholder="Password" id="password">

                    </div>
                    <div class="register-label">
                        <label for="retype-password">Re-type Your Password </label>
                        <input type="password" placeholder="Re-type Password" id="retype-password">
                    </div>
                    <div class="register-checkbox">
                        <label for="">
                            <input type="checkbox" class="custom-checkbox">
                            <span>Agree our <a href="">Terms and Conditions</a></span>
                        </label>
                    </div>
                    <button type="submit" class="btn-register">Register</button>
                    <span class="space">— OR — </span>
                    <button type="submit" class="btn-register"><i class="fa-brands fa-facebook-f"></i>Register with
                        Facebook</button>
                    <button type="submit" class="btn-register"><i class="fa-brands fa-twitter"></i>Register with
                        Twitter</button>
                    <button type="submit" class="btn-register"><i class="fa-brands fa-google"></i>Register with
                        Google</button>
                </form>

            </div>
            <div class="register-image">
                <img src="./asset/Travel.jpg" alt="">
            </div>
        </div>
    </div>
</body>

</html>
